name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned: Playwright 1.59 cannot install its browser on ubuntu-latest (26.04).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm test
      # v3 keeps dot-directories; v4 drops them unless include-hidden-files is
      # set, which would silently drop .well-known/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Checks what Pages and Cloudflare actually serve: an edge feature that
  # rewrites the page's inline script breaks its CSP hash and blanks it.
  smoke:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          set -e
          curl -fsS https://fbrc.social/.well-known/apple-app-site-association -o live-aasa.json
          python3 -m json.tool live-aasa.json > /dev/null
          cmp live-aasa.json site/.well-known/apple-app-site-association
          # Pages differ only in their previews, so each is checked.
          for page in join space; do
            curl -fsS https://fbrc.social/$page -o live.html
            cmp live.html site/$page.html
          done
